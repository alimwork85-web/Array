[package]
name = "array"
version = "2.0.0"
edition = "2021"

# اسم البرنامج النهائي: Array.exe
[[bin]]
name = "Array"
path = "src/main.rs"

[dependencies]
walkdir = "2.5"
lofty = "0.21"
rfd = "0.14"
eframe = "0.27"
regex = "1.10"
image = "0.24"
ar-reshaper = "1.5"
unicode-bidi = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
tract-onnx = "0.21"
kamadak-exif = "0.5"
rayon = "1"

[build-dependencies]
winres = "0.1"

# بناء التطوير: بدون معلومات تتبّع للمكتبات الخارجية (كانت تملأ المجلد بالغيغابايتات)
# ومع تحسين سرعتها (نماذج الوجوه بطيئة جداً بدون تحسين)
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 2

# النسخة النهائية: بدون رموز التتبّع داخل ملف exe
[profile.release]
strip = "debuginfo"
